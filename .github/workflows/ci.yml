name: ci

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: native cairo for the optional cross-renderer
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: optional dependencies for the print route
        run: python -m pip install --disable-pip-version-check pillow pymupdf cairosvg
      - name: selftest (pure script)
        run: |
          python vector-ai-studio/scripts/selftest.py --json > "$RUNNER_TEMP/selftest.json" || true
          python -c "import json,os,sys; d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'selftest.json'))); x=d.get('data') or {}; bad=[a for a in (x.get('assertions') or []) if a.get('ok') is False]; print('CODE=%s FAILED=%s SKIPPED=%s' % (d.get('code'), x.get('failed'), len([a for a in (x.get('assertions') or []) if a.get('ok') is None]))); print('ERRORS=', json.dumps(d.get('errors'), ensure_ascii=False)[:1200]); [print('FAILED-ASSERTION:', a['id'], '|', str(a.get('detail'))[:200]) for a in bad]; sys.exit(0 if d.get('code') in (0,3) and x.get('failed')==0 else 1)"
      - name: selftest (with fixtures)
        run: |
          python vector-ai-studio/scripts/selftest.py --json --fixtures > "$RUNNER_TEMP/selftest-fixtures.json" || true
          python -c "import json,os,sys; d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'selftest-fixtures.json'))); x=d.get('data') or {}; print('FIX-CODE=%s FAILED=%s' % (d.get('code'), x.get('failed'))); print('ERRORS=', json.dumps(d.get('errors'), ensure_ascii=False)[:1200]); sys.exit(0 if d.get('code') in (0,3) and x.get('failed')==0 else 1)"
      - name: fixture regression
        run: python vector-ai-studio/scripts/run_fixtures.py --json
      - name: contract is a generated artifact (no drift)
        run: python vector-ai-studio/scripts/gen_contract.py --check
      - name: shipped attack set
        run: python vector-ai-studio/scripts/redteam.py --json
      - name: outward-claim registry holds (against this machine's selftest)
        run: python vector-ai-studio/scripts/validate_claims.py --json --selftest-json "$RUNNER_TEMP/selftest.json"
